<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#67c1df">
<title>광주대학교 산업디자인학과 제43회 졸업전시회 DIRECTION</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    touch-action: pan-y;
  }
  #stage {
    position: relative; width: 100%; height: 100%; height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; background: #000;
  }
  .page {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
  }
  .page.active { display: flex; }
  .art {
    position: relative; height: 100%; height: 100dvh; max-height: 100%;
    aspect-ratio: 297.75 / 419.25; max-width: 100vw;
  }
  .art img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .map-link {
    position: absolute; left: 49.94%; top: 72.48%;
    width: 40.0%; height: 20.38%; display: block;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .nav {
    position: fixed; top: 50%; transform: translateY(-50%);
    border: 0; border-radius: 999px; width: 42px; height: 42px;
    background: rgba(255,255,255,.78); color: #173747;
    font-size: 25px; line-height: 1; cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,.12); z-index: 5;
  }
  #prev { left: max(10px, env(safe-area-inset-left)); }
  #next { right: max(10px, env(safe-area-inset-right)); }
  #counter {
    position: fixed; bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%); z-index: 5;
    padding: 5px 10px; border-radius: 999px;
    color: #173747; background: rgba(255,255,255,.72);
    font-size: 12px; letter-spacing: .04em;
  }
  @media (min-aspect-ratio: 29775/41925) {
    .art { height: 100dvh; width: auto; }
  }
  @media (max-aspect-ratio: 29775/41925) {
    .art { width: 100vw; height: auto; max-height: 100dvh; }
  }
  @media (min-width: 900px) {
    .nav { opacity: .72; }
    .nav:hover { opacity: 1; }
  }
</style>
</head>
<body>
<main id="stage" aria-label="DIRECTION 졸업전시 초청장">
  <section class="page active" aria-label="초청장 1페이지">
    <div class="art">
      <img src="assets/page-1.png" alt="DIRECTION 졸업전시 초청장 1페이지">
      <a class="map-link" href="https://kko.to/fIbNd0JlVr" target="_blank" rel="noopener"
         aria-label="카카오맵에서 전시장 위치 보기" title="카카오맵에서 전시장 위치 보기"></a>
    </div>
  </section>
  <section class="page" aria-label="초청장 2페이지">
    <div class="art">
      <img src="assets/page-2.png" alt="DIRECTION 졸업전시 초청장 2페이지">
    </div>
  </section>
</main>
<button class="nav" id="prev" type="button" aria-label="이전 페이지" hidden>‹</button>
<button class="nav" id="next" type="button" aria-label="다음 페이지">›</button>
<div id="counter" aria-live="polite">1 / 2</div>
<script>
(() => {
  const pages = [...document.querySelectorAll('.page')];
  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  const counter = document.getElementById('counter');
  let current = 0;
  function show(index) {
    current = Math.max(0, Math.min(pages.length - 1, index));
    pages.forEach((p, i) => p.classList.toggle('active', i === current));
    prev.hidden = current === 0;
    next.hidden = current === pages.length - 1;
    counter.textContent = `${current + 1} / ${pages.length}`;
  }
  prev.addEventListener('click', () => show(current - 1));
  next.addEventListener('click', () => show(current + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') show(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(current - 1);
  });
  let startX = 0, startY = 0;
  document.addEventListener('touchstart', e => {
    if (!e.touches.length) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', e => {
    if (!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.25) {
      show(current + (dx < 0 ? 1 : -1));
    }
  }, {passive:true});
})();
</script>
</body>
</html>
